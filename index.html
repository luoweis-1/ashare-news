<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A股早报 · 2026-11-28</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b1020;
    --bg-2: #131a32;
    --card: #1a2240;
    --card-2: #232c52;
    --text: #e8ecf5;
    --muted: #9aa3c0;
    --bull: #10b981;
    --bull-2: #34d399;
    --bear: #ef4444;
    --bear-2: #f87171;
    --gold: #f59e0b;
    --line: #2a335a;
    --accent: #6366f1;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #0a0f1f 0%, #0d1430 100%);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    padding-bottom: 40px;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px; }

  /* 顶部 */
  .header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 16px; margin-bottom: 24px;
  }
  .header h1 {
    font-size: 24px; font-weight: 800;
    background: linear-gradient(90deg, #f59e0b 0%, #ef4444 50%, #10b981 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header .sub { color: var(--muted); font-size: 12px; }
  .meta { text-align: right; font-size: 12px; color: var(--muted); }
  .meta strong { color: var(--text); font-size: 14px; }

  /* 统计 */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .stat .val { font-size: 18px; font-weight: 700; margin-top: 4px; }

  /* 筛选按钮 */
  .filters {
    display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .filter {
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 12px;
    background: var(--card); color: var(--muted); border: 1px solid var(--line);
    transition: all 0.2s;
  }
  .filter.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* 新闻卡片 */
  .news-list { display: flex; flex-direction: column; gap: 8px; }
  .news-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px; display: flex; gap: 14px; align-items: flex-start;
    transition: border-color 0.2s;
  }
  .news-card:hover { border-color: var(--accent); }
  .news-card .source-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 700;
    white-space: nowrap; min-width: 48px; text-align: center;
  }
  .source-cls { background: rgba(99,102,241,0.15); color: #818cf8; }
  .source-wallstreetcn { background: rgba(16,185,129,0.15); color: var(--bull-2); }
  .source-jinshi { background: rgba(245,158,11,0.15); color: var(--gold); }
  .news-card .body { flex: 1; min-width: 0; }
  .news-card .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .news-card .summary { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .news-card .footer { display: flex; gap: 10px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .news-card .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .news-card .tag {
    font-size: 10px; padding: 1px 6px; border-radius: 4px;
    background: var(--card-2); color: var(--muted);
  }

  /* 页脚 */
  .footer-note {
    text-align: center; margin-top: 32px; font-size: 11px; color: var(--muted);
  }
  .footer-note a { color: var(--accent); text-decoration: none; }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .header h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <h1>📊 A股早报</h1>
      <div class="sub">2026-11-28 开市前速览</div>
    </div>
    <div class="meta">
      更新于 <strong>2026-11-28T13:38:41.541539+08:00</strong><br>
      0条新闻 · 3来源
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">总新闻</div>
      <div class="val">0条</div>
    </div>
    <div class="stat">
      <div class="label">财联社</div>
      <div class="val">0条</div>
    </div>
    <div class="stat">
      <div class="label">华尔街见闻</div>
      <div class="val">0条</div>
    </div>
    <div class="stat">
      <div class="label">金十数据</div>
      <div class="val">0条</div>
    </div>
  </div>

  <div class="news-list">

  <div class="footer-note">
    ⚡ 每日北京时间 8:00 自动更新 · <a href="https://github.com/luoweis-1/ashare-news/actions">Actions</a>
  </div>

</div>
</body>
</html>
